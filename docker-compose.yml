name: udyam

x-go-service: &go-service
  restart: unless-stopped
  env_file: [.env]
  environment: &go-env
    DATABASE_URL: postgres://${POSTGRES_USER:-udyam}:${POSTGRES_PASSWORD:-udyam}@postgres:5432/${POSTGRES_DB:-udyam}?sslmode=disable
    KAFKA_BROKERS: kafka:19092
    KYC_REFERENCE_DATE: ${KYC_REFERENCE_DATE:-2026-07-15}
  depends_on:
    postgres:   { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
    db-roles:   { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-udyam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udyam}
      POSTGRES_DB: ${POSTGRES_DB:-udyam}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-udyam} -d ${POSTGRES_DB:-udyam}"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes: ["./infra/kafka:/init:ro"]
    restart: "no"

  # Per-service Postgres roles (infra/postgres/roles.sql); idempotent, runs on every `up`.
  db-roles:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-udyam}
      PGOPTIONS: "-c udyam.pw=${SERVICE_DB_PASSWORD:-udyam-svc}"
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-udyam}", "-d", "${POSTGRES_DB:-udyam}", "-q", "-f", "/init/roles.sql"]
    volumes: ["./infra/postgres:/init:ro"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  gateway:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: gateway } }
    ports: ["8080:8080"]
    environment:
      <<: *go-env
      PORT: "8080"
      CORS_ORIGINS: "*"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin-token}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-30}

  registry:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: registry } }
    environment: { <<: *go-env, PORT: "8081", DATABASE_URL: "postgres://svc_registry:${SERVICE_DB_PASSWORD:-udyam-svc}@postgres:5432/${POSTGRES_DB:-udyam}?sslmode=disable" }
  rules:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: rules } }
    environment: { <<: *go-env, PORT: "8082", DATABASE_URL: "postgres://svc_rules:${SERVICE_DB_PASSWORD:-udyam-svc}@postgres:5432/${POSTGRES_DB:-udyam}?sslmode=disable" }
  quote:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: quote } }
    environment: { <<: *go-env, PORT: "8083", DATABASE_URL: "postgres://svc_quote:${SERVICE_DB_PASSWORD:-udyam-svc}@postgres:5432/${POSTGRES_DB:-udyam}?sslmode=disable" }
  kyc:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: kyc } }
    environment: { <<: *go-env, PORT: "8084", KYC_DEMO_OTP: "${KYC_DEMO_OTP:-true}", DATABASE_URL: "postgres://svc_kyc:${SERVICE_DB_PASSWORD:-udyam-svc}@postgres:5432/${POSTGRES_DB:-udyam}?sslmode=disable" }
    volumes: ["./data/kyc_documents:/data/kyc_documents:ro"]
  tracker:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: tracker } }
    environment: { <<: *go-env, PORT: "8085", DATABASE_URL: "postgres://svc_tracker:${SERVICE_DB_PASSWORD:-udyam-svc}@postgres:5432/${POSTGRES_DB:-udyam}?sslmode=disable" }
  notify:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: notify } }
    environment: { <<: *go-env, PORT: "8086", DATABASE_URL: "postgres://svc_notify:${SERVICE_DB_PASSWORD:-udyam-svc}@postgres:5432/${POSTGRES_DB:-udyam}?sslmode=disable" }
  simulator:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: simulator } }
    environment: { <<: *go-env, TRACKER_URL: "http://tracker:8085" }
    depends_on: { tracker: { condition: service_started } }
  scoring:
    <<: *go-service
    build: { context: ./go, args: { SERVICE: scoring } }
    environment: { <<: *go-env, PORT: "8087", DATABASE_URL: "postgres://svc_scoring:${SERVICE_DB_PASSWORD:-udyam-svc}@postgres:5432/${POSTGRES_DB:-udyam}?sslmode=disable", SCORING_IMPORT_CSV: /data/smb_leads.csv }
    volumes: ["./data/smb_leads.csv:/data/smb_leads.csv:ro"]

  advisor:
    build:
      context: ./ts
      dockerfile: services/advisor/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: "8090"
      RULES_URL: http://rules:8082
      QUOTE_URL: http://quote:8083
      REGISTRY_URL: http://registry:8081
      KAFKA_BROKERS: kafka:19092
    ports: ["8090:8090"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  kafkadata:
